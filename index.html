<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finance Dashboard</title>
<style>
:root{--bg:#0b0c14;--surface:#13141f;--border:#1e2035;--text:#e2e4ef;--muted:#6b7280;--bull:#00c896;--bear:#e8754a;--neutral:#f5a623;--accent:#7b6ef6}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.55;padding:24px}
.wrap{max-width:1180px;margin:0 auto}
header{position:relative;padding:18px 20px;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:18px}
header h1{font-size:19px;letter-spacing:.2px}
header .sub{color:var(--muted);font-size:12px;margin-top:4px}
.full-brief-link{position:absolute;top:18px;right:20px;color:var(--accent);text-decoration:none;font-size:12px;font-weight:600;border:1px solid var(--border);padding:6px 11px;border-radius:6px;background:var(--bg)}
.full-brief-link:hover{border-color:var(--accent)}
h2{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.composite{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--bull);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.composite.bah{border-left-color:var(--neutral)}
.composite .updated{font-size:12px;color:var(--muted);margin-bottom:8px}
.composite .big{font-size:26px;font-weight:700;letter-spacing:-.4px}
.composite .row{display:flex;flex-wrap:wrap;gap:22px;margin-top:10px;font-size:13px}
.composite .row div span{color:var(--muted);display:block;font-size:11px;text-transform:uppercase;letter-spacing:.8px}
.badge{display:inline-block;padding:3px 9px;border-radius:5px;font-size:11px;font-weight:700;letter-spacing:.5px;vertical-align:middle}
.b-neutral{background:rgba(245,166,35,.14);color:var(--neutral)}
.b-bull{background:rgba(0,200,150,.14);color:var(--bull)}
.b-bear{background:rgba(232,117,74,.14);color:var(--bear)}
.b-2x{background:rgba(123,110,246,.16);color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin-bottom:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:14px 16px}
.card .label{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);margin-bottom:6px}
.card .val{font-size:19px;font-weight:650}
.card .note{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.45}
.bull{color:var(--bull)}.bear{color:var(--bear)}.neu{color:var(--neutral)}.acc{color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:16px 18px}
.panel ul{list-style:none}
.panel li{padding:5px 0;font-size:13px;border-bottom:1px solid rgba(30,32,53,.6)}
.panel li:last-child{border-bottom:none}
.lens{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.lens:last-child{border-bottom:none}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px;margin-top:6px}
.lens .name{font-weight:650;font-size:13.5px}
.lens .find{color:var(--muted);font-size:12.5px;margin-top:3px}
.chartbox{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:12px;margin-bottom:12px}
.chartbox .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.chartbox .hd span{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.tgl{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:4px 9px;font-size:11px;cursor:pointer}
.tv{height:380px;transition:height .2s}
.tv.exp{height:720px}
.crit{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--bull);border-radius:9px;padding:14px 16px;margin-bottom:10px}
.crit.bearish{border-left-color:var(--bear)}
.crit.caution{border-left-color:var(--neutral)}
.crit .t{font-weight:700;font-size:13px;margin-bottom:5px}
.crit .d{font-size:12.5px;color:var(--muted)}
footer{margin-top:30px;padding-top:16px;border-top:1px solid var(--border);color:var(--muted);font-size:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
footer a{color:var(--accent);text-decoration:none;margin-left:14px}
  .err{background:#2a1215;border:1px solid #5a1f24;color:#ffb4b4;padding:12px;border-radius:8px;font-size:13px;margin:12px 0}
  .find a,.note a,.panel a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Finance Agent V4 — Daily Dashboard</h1>
  <div class="sub" id="upd"></div>
  <a class="full-brief-link" href="https://rdwills02.github.io/BTC_Brief/calculator.html" target="_blank" style="right:140px;">Calculator ↗</a>
  <a class="full-brief-link" href="https://rdwills02.github.io/BTC_Brief/brief.html" target="_blank">Full Brief →</a>
</header>
<div id="app"><div class="panel">Loading dashboard.json…</div></div>
<footer id="foot"></footer>
</div>
<script src="https://s3.tradingview.com/tv.js"></script>
<script>
/* Finance Agent V4 dashboard — STATIC TEMPLATE v3 (2026-10-07). Structure and CSS are the 2026-09-26 design verbatim.
   The morning task writes ONLY dashboard.json (schema 2); this file never changes day to day. */
var GLOSS='https://rdwills02.github.io/BTC_Brief/glossary.html';
function esc(s){return String(s==null?'❓':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function inl(s){s=esc(s);s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');s=s.replace(/\[(→ Glossary|Glossary)\]\((https?:\/\/[^)\s]+)\)/g,'<a class="acc" style="text-decoration:none" href="$2" target="_blank">→ Glossary</a>');s=s.replace(/\[→ Glossary\]/g,'<a class="acc" style="text-decoration:none" href="'+GLOSS+'" target="_blank">→ Glossary</a>');s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');s=s.replace(/\{(bull|bear|neu|mut):([^}]*)\}/g,'<span class="$1">$2</span>');return s;}
function tone(t){t=String(t||'').toLowerCase();return t==='bull'?'bull':(t==='bear'?'bear':(t==='neutral'||t==='neu'?'neu':''));}
function toneVar(t){t=tone(t);return t==='bull'?'var(--bull)':(t==='bear'?'var(--bear)':'var(--neutral)');}
function bcls(t){t=tone(t);return t==='bull'?'b-bull':(t==='bear'?'b-bear':'b-neutral');}
function gl(){return ' <a class="acc" style="text-decoration:none" href="'+GLOSS+'" target="_blank">→ Glossary</a>';}
function cards(arr){return '<div class="cards">'+(arr||[]).map(function(c){return '<div class="card"><div class="label">'+esc(c.label)+(c.glossary?gl():'')+'</div><div class="val '+tone(c.tone)+'">'+inl(c.value)+'</div><div class="note">'+inl(c.note)+'</div></div>';}).join('')+'</div>';}
function rows(arr){return '<div class="row">'+(arr||[]).map(function(r){return '<div><span>'+esc(r.k)+'</span>'+(r.tone?'<span class="'+tone(r.tone)+'">'+inl(r.v)+'</span>'+(r.rest?' '+inl(r.rest):''):inl(r.v))+'</div>';}).join('')+'</div>';}
function composite(c,cls,style){return '<div class="composite'+(cls?' '+cls:'')+'"'+(style||'')+'><div class="updated">'+inl(c.caption)+'</div><div class="big">'+esc(c.price)+' <span class="badge '+bcls(c.badgeTone)+'">'+esc(c.badge)+'</span> <span class="badge '+bcls(c.confidenceTone||'neutral')+'">CONFIDENCE: '+esc(c.confidence)+'</span></div>'+rows(c.rows)+'</div>';}
function panelList(title,titleTone,items){return '<div class="panel"><ul>'+(title?'<li><strong'+(titleTone?' class="'+tone(titleTone)+'"':'')+'>'+esc(title)+'</strong></li>':'')+(items||[]).map(function(i){return '<li>'+(typeof i==='string'?inl(i):('<strong>'+esc(i.b)+'</strong>'+(i.glossary?gl():'')+' '+inl(i.text)))+'</li>';}).join('')+'</ul></div>';}
function lenses(arr){return '<div class="panel">'+(arr||[]).map(function(l){return '<div class="lens"><div class="dot" style="background:'+toneVar(l.tone)+'"></div><div><div class="name">'+esc(l.name)+(l.badges||[]).map(function(b){return ' <span class="badge '+(b.tone==='2x'?'b-2x':bcls(b.tone))+'">'+esc(b.text)+'</span>';}).join('')+'</div><div class="find">'+inl(l.finding)+'</div></div></div>';}).join('')+'</div>';}
function chart(id,label){return '<div class="chartbox"><div class="hd"><span>Live Chart — '+esc(label)+'</span><button class="tgl" onclick="tg(\''+id+'C\',this)">⛶ Expand</button></div><div id="'+id+'C" class="tv"><div class="tradingview-widget-container" style="height:100%"><div id="tv_'+id+'" style="height:100%"></div></div></div></div>';}
function render(d){
  var o='';
  o+=composite(d.btc,'',' style="border-left-color:'+toneVar(d.btc.badgeTone)+'"');
  o+=cards(d.btc.cards.slice(0,4))+cards(d.btc.cards.slice(4,8));
  o+=chart('btc','BTCUSD');
  o+='<h2>BTC Key Levels</h2><div class="two">'+panelList('Resistance','bear',d.btc.resistance)+panelList('Support','bull',d.btc.support)+'</div>';
  o+='<h2>Cycle Timing &amp; Macro</h2><div class="two">'+panelList(null,null,d.btc.cycle)+panelList(null,null,d.btc.macro)+'</div>';
  o+='<h2>BTC Lens Scorecard</h2>'+lenses(d.btc.lenses);
  if(d.btc.tension)o+='<div class="panel" style="border-left:3px solid var(--neutral);margin-top:10px"><div class="find">'+inl(d.btc.tension)+'</div></div>';
  o+=composite(d.bah,'bah',' style="margin-top:26px"');
  o+=cards(d.bah.cards.slice(0,4))+cards(d.bah.cards.slice(4,8));
  o+=chart('bah','NYSE:BAH');
  o+='<h2>BAH Lens Scorecard'+(d.bah.lensNote?' <span style="color:var(--muted);text-transform:none;letter-spacing:0;font-size:12px">('+esc(d.bah.lensNote)+')</span>':'')+'</h2>'+lenses(d.bah.lenses);
  if(d.k401&&d.k401.text)o+='<h2>401(k) · Venus (S&amp;P 500)</h2><div class="panel"><div class="find">'+inl(d.k401.text)+'</div></div>';
  o+='<h2>Watch List</h2><div class="panel"><ul>'+(d.watchlist||[]).map(function(w){return '<li>'+(typeof w==='string'?inl(w):(esc(w.icon||'⚡')+' <strong>'+esc(w.b)+'</strong> — '+inl(w.text)))+'</li>';}).join('')+'</ul></div>';
  o+='<h2>Bottom Line</h2><div class="two"><div class="panel"><div style="font-weight:700;margin-bottom:7px">'+esc(d.bottom.btc.title)+'</div><div style="font-size:12.8px;color:var(--muted)">'+inl(d.bottom.btc.text)+'</div></div><div class="panel"><div style="font-weight:700;margin-bottom:7px">'+esc(d.bottom.bah.title)+'</div><div style="font-size:12.8px;color:var(--muted)">'+inl(d.bottom.bah.text)+'</div></div></div>';
  document.getElementById('app').innerHTML=o;
  document.getElementById('upd').textContent='Last updated: '+d.updated+(d.testRun?' · ⚠️ TEST RUN — not a live pull':'');
  document.getElementById('foot').innerHTML='<div>Finance Agent V4 · Last updated: '+esc(d.updated)+'</div><div><a href="https://rdwills02.github.io/BTC_Brief/">Dashboard</a> <a href="https://rdwills02.github.io/BTC_Brief/brief.html" target="_blank">Full Brief</a> <a href="'+GLOSS+'" target="_blank">Glossary</a> <a href="https://rdwills02.github.io/BTC_Brief/calculator.html" target="_blank">Calculator</a></div>';
  document.title='Finance Dashboard — '+(d.dateShort||'');
  try{initCharts();}catch(e){}
}

function mk(id,sym){new TradingView.widget({autosize:true,symbol:sym,interval:"D",timezone:"America/Chicago",theme:"dark",style:"1",locale:"en",toolbar_bg:"#0b0c14",enable_publishing:false,hide_side_toolbar:false,allow_symbol_change:false,backgroundColor:"#0b0c14",gridColor:"#1e2035",studies:["MASimple@tv-basicstudies"],container_id:id});}
function initCharts(){mk("tv_btc","BITSTAMP:BTCUSD");mk("tv_bah","NYSE:BAH");}
function tg(id,btn){var el=document.getElementById(id);el.classList.toggle("exp");btn.textContent=el.classList.contains("exp")?"⛶ Collapse":"⛶ Expand";}

fetch('dashboard.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(function(d){if(!d||d.schema!==2||!d.btc||!d.bah)throw new Error('dashboard.json: expected schema 2');render(d);}).catch(function(e){document.getElementById('app').innerHTML='<div class="err">Dashboard data unavailable: '+esc(e.message)+'. The page structure is fixed; the morning task writes dashboard.json.</div>';});
</script>
</body>
</html>
