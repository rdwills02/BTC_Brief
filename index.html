<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Dashboard</title>
<style>
  :root{
    --bg:#0b0c14; --surface:#13141f; --border:#1e2035; --text:#e2e4ef; --muted:#6b7280;
    --bull:#00c896; --bear:#e8754a; --neutral:#f5a623; --accent:#7b6ef6;
  }
  *{box-sizing:border-box;}
  body{background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; margin:0; padding:0;}
  .wrap{max-width:1200px; margin:0 auto; padding:20px;}
  header{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px;}
  header h1{font-size:20px; margin:0; color:var(--text);}
  .nav-links{display:flex; gap:12px;}
  .full-brief-link{color:var(--accent); text-decoration:none; font-size:14px; font-weight:600; border:1px solid var(--border); padding:8px 14px; border-radius:6px;}
  .full-brief-link:hover{background:var(--surface);}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:18px; margin-bottom:16px;}
  .header-card{border-left:4px solid var(--neutral);}
  .header-card.bull{border-left-color:var(--bull);}
  .header-card.bear{border-left-color:var(--bear);}
  .updated{color:var(--muted); font-size:12px; margin-bottom:6px;}
  .composite-row{display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:10px;}
  .price-big{font-size:32px; font-weight:700;}
  .badge{display:inline-block; padding:4px 10px; border-radius:20px; font-size:12px; font-weight:700; margin-left:8px;}
  .badge.neutral{background:rgba(245,166,35,0.15); color:var(--neutral);}
  .badge.bull{background:rgba(0,200,150,0.15); color:var(--bull);}
  .badge.bear{background:rgba(232,117,74,0.15); color:var(--bear);}
  .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:16px;}
  @media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr);}}
  .stat{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px;}
  .stat .label{color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:0.5px;}
  .stat .value{font-size:18px; font-weight:700; margin-top:4px;}
  .stat .sub{font-size:12px; color:var(--muted); margin-top:2px;}
  h2{font-size:15px; color:var(--text); border-bottom:1px solid var(--border); padding-bottom:8px; margin-top:28px;}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media(max-width:800px){.two-col{grid-template-columns:1fr;}}
  .lens-row{display:flex; align-items:flex-start; gap:10px; padding:12px 0; border-bottom:1px solid var(--border);}
  .lens-row:last-child{border-bottom:none;}
  .dot{width:10px; height:10px; border-radius:50%; margin-top:5px; flex-shrink:0;}
  .dot.bull{background:var(--bull);} .dot.bear{background:var(--bear);} .dot.neutral{background:var(--neutral);}
  .lens-name{font-weight:600; font-size:14px;}
  .weight-badge{background:rgba(123,110,246,0.15); color:var(--accent); font-size:10px; padding:2px 7px; border-radius:10px; margin-left:6px;}
  .lens-finding{font-size:13px; color:var(--muted); margin-top:3px;}
  .chart-wrap{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px; margin-bottom:16px; position:relative;}
  .chart-toggle{position:absolute; top:14px; right:14px; z-index:5; background:var(--border); color:var(--text); border:none; border-radius:6px; padding:4px 10px; font-size:12px; cursor:pointer;}
  .tv-container{height:400px;}
  .tv-container.expanded{height:700px;}
  .levels-col{}
  .level-item{padding:6px 0; font-size:13px;}
  .res{color:var(--bear);} .sup{color:var(--bull);}
  .bottom-line{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px; font-size:13px; line-height:1.6;}
  .watchlist li{font-size:13px; margin-bottom:6px; color:var(--text);}
  footer{text-align:center; color:var(--muted); font-size:12px; margin-top:30px; padding-top:20px; border-top:1px solid var(--border);}
  footer a{color:var(--accent); text-decoration:none; margin:0 6px;}
  .crit{border-left:4px solid var(--neutral); background:var(--surface); border-radius:8px; padding:14px; margin-bottom:10px; font-size:13px;}
  a.glossary{color:var(--accent); text-decoration:none;}

  .sub.bear{color:var(--bear)} .sub.bull{color:var(--bull)} .err{background:#2a1215;border:1px solid #5a1f24;color:#ffb4b4;padding:12px;border-radius:8px;margin:12px 0;font-size:13px}
  .stale{color:var(--muted);font-size:11px;margin-left:6px}
</style>

<body>
<div class="wrap">
<header>
  <h1>Finance Agent V4 · Dashboard</h1>
  <div class="nav-links">
    <a class="full-brief-link" href="https://rdwills02.github.io/BTC_Brief/brief.html" target="_blank">Full Brief →</a>
    <a class="full-brief-link" href="https://rdwills02.github.io/BTC_Brief/calculator.html" target="_blank" style="right:140px;">Calculator ↗</a>
  </div>
</header>
<div id="app"><div class="card"><div class="updated">Loading dashboard.json…</div></div></div>
<footer id="foot"></footer>
</div>
<script src="https://s3.tradingview.com/tv.js"></script>
<script>
/* Finance Agent V4 dashboard — STATIC TEMPLATE (2026-10-07). The morning task writes ONLY dashboard.json; this file's
   structure never changes. Schema: see dashboard.json "schema" and the brief task prompt. Unknown = "❓". */
var GLOSS='https://rdwills02.github.io/BTC_Brief/glossary.html';
function esc(s){return String(s==null?'❓':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function g(label,gl){return gl?'<a class="glossary" href="'+GLOSS+'">'+esc(label)+'</a>':esc(label);}
function badgeCls(t){t=String(t||'').toLowerCase();return /bull|buy|sell now|🟢/.test(t)?'bull':(/bear|🔴/.test(t)?'bear':'neutral');}
function dot(s){s=String(s||'neutral').toLowerCase();return s==='bull'||s==='green'?'bull':(s==='bear'||s==='red'?'bear':'neutral');}
function stats(arr){return '<div class="grid">'+(arr||[]).map(function(s){return '<div class="stat"><div class="label">'+g(s.label,s.glossary)+'</div><div class="value">'+esc(s.value)+'</div><div class="sub">'+esc(s.sub)+'</div></div>';}).join('')+'</div>';}
function lenses(arr){return '<div class="card">'+(arr||[]).map(function(l){return '<div class="lens-row"><div class="dot '+dot(l.signal)+'"></div><div><div class="lens-name">'+esc(l.name)+(l.weight?' <span class="weight-badge">'+esc(l.weight)+'</span>':'')+(l.stale?' <span class="stale">⏸️ stale</span>':'')+'</div><div class="lens-finding">'+esc(l.finding)+'</div></div></div>';}).join('')+'</div>';}
function header(h,opts){opts=opts||{};return '<div class="card header-card"'+(opts.style||'')+'><div class="updated">'+esc(h.caption)+'</div><div class="composite-row"><div><span class="price-big">'+esc(h.ticker)+' '+esc(h.price)+'</span> <span class="badge '+badgeCls(h.composite)+'">'+esc(h.composite)+(h.confidence?' · '+esc(h.confidence):'')+'</span></div><div style="font-size:13px;color:var(--muted);">'+esc(h.line)+'</div></div></div>';}
function render(d){
  var o='';
  o+=header({caption:'Last updated: '+d.updated,ticker:'BTC',price:d.btc.price,composite:d.btc.composite,confidence:d.btc.confidence,line:d.btc.line});
  o+=stats(d.btc.stats.slice(0,4))+stats(d.btc.stats.slice(4,8));
  o+='<div class="chart-wrap"><button class="chart-toggle" onclick="toggleChart(\'btc\')">⛶ Expand</button><div class="tv-container" id="btc-chart"></div></div>';
  o+='<h2>📍 BTC Key Levels</h2><div class="two-col"><div class="levels-col"><div class="level-item res">🔴 Resistance: '+esc(d.btc.resistance)+'</div></div><div class="levels-col"><div class="level-item sup">🟢 Support: '+esc(d.btc.support)+'</div></div></div>';
  o+='<h2>⏱️ Cycle Timing &amp; Macro</h2><div class="two-col"><div>'+(d.btc.cycle||[]).map(function(x){return '<div class="level-item">'+esc(x)+'</div>';}).join('')+'</div><div>'+(d.btc.macro||[]).map(function(x){return '<div class="level-item">'+esc(x)+'</div>';}).join('')+'</div></div>';
  o+='<h2>🔍 BTC Lens Scorecard</h2>'+lenses(d.btc.lenses);
  if(d.critical&&d.critical.length){o+='<h2>⚡ Critical Developments</h2><div class="card">'+d.critical.map(function(c){return '<div class="lens-row"><div class="dot '+dot(c.signal)+'"></div><div><div class="lens-name">'+esc(c.title)+'</div><div class="lens-finding">'+esc(c.text)+'</div></div></div>';}).join('')+'</div>';}
  o+=header({caption:'⚡ BAH Sell Zone'+(d.bah.caption?' · '+d.bah.caption:''),ticker:'BAH',price:d.bah.price,composite:d.bah.composite,confidence:d.bah.confidence,line:d.bah.line},{style:' style="border-left-color:var(--neutral);margin-top:30px;"'});
  o+=stats(d.bah.stats.slice(0,4))+stats(d.bah.stats.slice(4,8));
  o+='<div class="chart-wrap"><button class="chart-toggle" onclick="toggleChart(\'bah\')">⛶ Expand</button><div class="tv-container" id="bah-chart"></div></div>';
  o+='<h2>🔍 BAH Lens Scorecard</h2>'+lenses(d.bah.lenses);
  if(d.k401&&d.k401.text){o+='<h2>📈 401(k) · Venus (S&amp;P 500)</h2><div class="card"><div class="lens-finding">'+esc(d.k401.text)+'</div></div>';}
  o+='<h2>🔍 Watch List</h2><div class="card"><ul class="watchlist">'+(d.watchlist||[]).map(function(w){return '<li>'+esc(w)+'</li>';}).join('')+'</ul></div>';
  o+='<h2>📋 Bottom Line</h2><div class="two-col"><div class="bottom-line"><strong>BTC:</strong> '+esc(d.btc.bottomLine)+'</div><div class="bottom-line"><strong>BAH:</strong> '+esc(d.bah.bottomLine)+'</div></div>';
  document.getElementById('app').innerHTML=o;
  document.getElementById('foot').innerHTML='Finance Agent V4 · Last updated: '+esc(d.updated)+(d.testRun?' · <span style="color:var(--neutral)">⚠️ TEST RUN — not a live pull</span>':'')+'<br><a href="'+GLOSS+'">Glossary</a> · <a href="https://rdwills02.github.io/BTC_Brief/">Dashboard</a> · <a href="https://rdwills02.github.io/BTC_Brief/calculator.html">Calculator</a>';
  document.title='Finance Dashboard — '+(d.dateShort||'');
  try{renderChart('btc-chart','BITSTAMP:BTCUSD');renderChart('bah-chart','NYSE:BAH');}catch(e){}
}
function renderChart(containerId,symbol){new TradingView.widget({autosize:true,symbol:symbol,interval:'D',timezone:'America/Chicago',theme:'dark',style:'1',locale:'en',toolbar_bg:'#0b0c14',backgroundColor:'#0b0c14',gridColor:'#1e2035',enable_publishing:false,hide_top_toolbar:false,studies:['MASimple@tv-basicstudies'],container_id:containerId});}
function toggleChart(which){document.getElementById(which+'-chart').classList.toggle('expanded');}
fetch('dashboard.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(function(d){
  if(!d||d.schema!==1||!d.btc||!d.bah)throw new Error('dashboard.json: unexpected schema');render(d);
}).catch(function(e){document.getElementById('app').innerHTML='<div class="err">Dashboard data unavailable: '+esc(e.message)+'. The page structure is fixed; the morning task writes dashboard.json.</div>';});
</script>
</body>
</html>
