name: Channel Radar Daily Capture

on:
  schedule:
    # 00:20 UTC daily — 20 min after the UTC daily close, so capture.js sees only closed bars (remediation F1).
    # Timed ~1hr after US equity market open to capture crypto's post-open volume/price reaction
    # (overnight/pre-market news gets reflected shortly after open). Cron is ALWAYS UTC and does
    # NOT follow US daylight saving, so this anchors to EDT; in winter it lands ~1hr earlier (at
    # open). Fine for a "roughly after open" goal. NOTE: the 4-day OHLC candle is already closed
    # regardless of capture time; this timing mainly sharpens the live 24h-volume snapshot.
    - cron: '20 0 * * *'
    # Retries (2026-10-05): run again at 06:20 and 12:20 UTC ONLY if the day's daily file is still
    # missing (the "Skip if already captured" step below). A successful 00:20 run makes these no-ops.
    - cron: '20 6 * * *'
    - cron: '20 12 * * *'
  workflow_dispatch: {}   # allows manual "Run workflow" from the Actions tab (always runs; no skip)

permissions:
  contents: write          # lets the built-in GITHUB_TOKEN commit captured data

concurrency:
  group: radar-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Skip if already captured today (scheduled runs only)
        id: guard
        run: |
          TODAY=$(date -u +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "data/daily/${TODAY}.json" ]; then
            echo "data/daily/${TODAY}.json already exists — scheduled retry not needed."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'   # Node 20 has global fetch built in

      - name: Run capture
        if: steps.guard.outputs.skip != 'true'
        env:
          CG_KEY: ${{ secrets.CG_KEY }}
        run: node capture.js

      - name: Commit captured data
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name  "radar-capture-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No new data to commit."
          else
            git commit -m "Daily capture — $(date -u +'%Y-%m-%d %H:%M UTC')"
            # Push with a bounded retry: if main moved during the run (a page push, the headlines
            # bot), rebase this data-only commit onto it and push again instead of failing the day.
            for i in 1 2 3; do
              git push && break
              echo "push rejected (attempt $i) — rebasing onto origin/main"
              git pull --rebase --autostash origin main || exit 1
            done
          fi
