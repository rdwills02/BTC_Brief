name: Radar Provisional Reconcile

# Item 41. Visibility only: projects fills, stop/target touches and marks onto the CURRENT forward generation from
# 5-minute Kraken evidence. It never runs capture.js, never edits a ledger file and never changes policy timing.
# Publication is compare-and-discard: a rejected push means the projection is stale and is dropped (never rebased, never forced).

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: radar-provisional
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Provisional projection
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node radar_tools/provisional.js
