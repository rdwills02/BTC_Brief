name: Headlines
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: radar-capture
  cancel-in-progress: false
jobs:
  headlines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 52b: read + write the rolling data repo through the lease publisher; the main-repo copy is still written (dual-write) until NEWS_MAIN_WRITE=0.
      - run: node radar_tools/news-fetch.js
        env:
          BOOK_ROLLING_URL: https://github.com/rdwills02/BTC_Brief-data.git
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
      - name: Commit
        run: |
          git config user.name radar-news-bot
          git config user.email actions@github.com
          git add data/news/headlines.json
          if ! git diff --cached --quiet; then
            git commit -m "Headlines — $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main && git push || { git pull --rebase origin main && git push; }
          fi
