<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Full Brief</title>
<style>
  :root{
    --bg:#0b0c14; --surface:#13141f; --border:#1e2035; --text:#e2e4ef; --muted:#6b7280;
    --bull:#00c896; --bear:#e8754a; --neutral:#f5a623; --accent:#7b6ef6;
  }
  *{box-sizing:border-box;}
  body{background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; margin:0;}
  .wrap{max-width:900px; margin:0 auto; padding:20px;}
  nav{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px; font-size:13px;}
  nav a{color:var(--accent); text-decoration:none;}
  .updated-top{color:var(--muted);}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:18px; margin-bottom:16px;}
  .header-card{border-left:4px solid var(--neutral);}
  h1{font-size:20px; margin:0 0 6px 0;}
  h2{font-size:16px; border-bottom:1px solid var(--border); padding-bottom:8px; margin-top:30px;}
  h3{font-size:14px; margin-bottom:4px;}
  .badge{display:inline-block; padding:4px 10px; border-radius:20px; font-size:12px; font-weight:700; margin-left:8px;}
  .badge.neutral{background:rgba(245,166,35,0.15); color:var(--neutral);}
  .badge.bull{background:rgba(0,200,150,0.15); color:var(--bull);}
  .badge.bear{background:rgba(232,117,74,0.15); color:var(--bear);}
  .lens-block{border:1px solid var(--border); border-radius:8px; padding:14px; margin-bottom:12px;}
  .lens-title{font-weight:700; font-size:14px; margin-bottom:6px;}
  .weight-badge{background:rgba(123,110,246,0.15); color:var(--accent); font-size:10px; padding:2px 7px; border-radius:10px; margin-left:6px;}
  .stale-badge{background:rgba(107,114,128,0.2); color:var(--muted); font-size:10px; padding:2px 7px; border-radius:10px; margin-left:6px;}
  .finding{font-size:13px; margin:4px 0;}
  .source{font-size:11px; color:var(--muted);}
  .source a{color:var(--accent);}
  .delta{font-size:13px; margin:6px 0;}
  .crit{border-left:4px solid var(--neutral); background:var(--surface); border-radius:8px; padding:14px; margin-bottom:10px; font-size:13px;}
  table{width:100%; border-collapse:collapse; font-size:12px;}
  td, th{border-bottom:1px solid var(--border); padding:6px 8px; text-align:left;}
  .snapshot-toggle{background:var(--border); color:var(--text); border:none; border-radius:6px; padding:8px 14px; cursor:pointer; font-size:13px;}
  #snapshot-body{display:none; margin-top:12px;}
  footer{text-align:center; color:var(--muted); font-size:12px; margin-top:30px; padding-top:20px; border-top:1px solid var(--border);}
  footer a{color:var(--accent); text-decoration:none; margin:0 6px;}
  ol{font-size:12px; color:var(--muted); padding-left:20px;}
  ol a{color:var(--accent);}
  a.glossary{color:var(--accent); text-decoration:none;}
  ul.watchlist li{font-size:13px; margin-bottom:6px;}
  .bottom-line{font-size:13px; line-height:1.6;}

  .sec{margin-top:26px}
  .para{font-size:13px;line-height:1.6;margin:6px 0}
  .para.src{font-size:11px;color:var(--muted)}
  .para.crit{border-left:4px solid var(--neutral);background:var(--surface);border-radius:8px;padding:10px 14px}
  .lead{font-size:14px;line-height:1.6}
  .err{background:#2a1215;border:1px solid #5a1f24;color:#ffb4b4;padding:12px;border-radius:8px;font-size:13px}
  ul.b{font-size:13px;line-height:1.6;margin:6px 0 6px 0;padding-left:22px}
</style></head>
<body><div class="wrap">
<nav><a href="https://rdwills02.github.io/BTC_Brief/">← Dashboard</a><a href="https://rdwills02.github.io/BTC_Brief/glossary.html" target="_blank">Glossary →</a><span class="updated-top" id="upd"></span></nav>
<div id="app"><div class="card">Loading brief.md…</div></div>
<footer id="foot"></footer>
</div>
<script>
/* Finance Agent V4 full brief — STATIC TEMPLATE (2026-10-07). The morning task writes ONLY brief.md (= BTC Brief Current.md);
   this file renders it. Rendering rules: a short line in CAPITALS (emoji allowed) = section heading; lines starting with
   • - * = bullets; | a | b | rows = table; blank line = paragraph break; [text](url), bare https URLs and **bold** are inline;
   a line starting "Source:" is muted; a line starting ⚡ is a callout; the first three lines are the header card. */
function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function inline(s){s=esc(s);s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');s=s.replace(/(^|[\s(])(https?:\/\/[^\s)\]<]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');return s;}
function isHeading(l){var t=l.replace(/[^A-Za-z]/g,'');return l.length<=70&&t.length>=3&&t===t.toUpperCase()&&!/\|/.test(l)&&!/^https?:/.test(l);}
function render(md){
  var lines=md.replace(/\r/g,'').split('\n'),i=0,o='',head=[];
  while(i<lines.length&&head.length<3){if(lines[i].trim())head.push(lines[i].trim());i++;}
  var bad=/BRIEF READY|TEST RUN/.test(head[0]||'');
  o+='<div class="card header-card"><h1>'+inline(head[0]||'')+'</h1><div class="lead">'+inline(head[1]||'')+'</div><p class="finding">'+inline(head[2]||'')+'</p></div>';
  var inList=false,inTable=false;
  function closeAll(){if(inList){o+='</ul>';inList=false;}if(inTable){o+='</table>';inTable=false;}}
  for(;i<lines.length;i++){var l=lines[i].trim();
    if(!l){closeAll();continue;}
    if(/^\|.*\|$/.test(l)){if(!inTable){closeAll();o+='<table>';inTable=true;}var cells=l.slice(1,-1).split('|').map(function(c){return c.trim();});if(/^:?-{2,}/.test(cells[0]))continue;o+='<tr>'+cells.map(function(c){return '<td>'+inline(c)+'</td>';}).join('')+'</tr>';continue;}
    if(/^[•\-\*]\s+/.test(l)){if(!inList){closeAll();o+='<ul class="b">';inList=true;}o+='<li>'+inline(l.replace(/^[•\-\*]\s+/,''))+'</li>';continue;}
    closeAll();
    if(isHeading(l)){o+='<h2 class="sec">'+inline(l)+'</h2>';continue;}
    if(/^\W{0,6}\d{1,2}\.\s+[A-Z]/.test(l)&&l.length<=90){o+='<h3 class="lens-title" style="margin-top:16px">'+inline(l)+'</h3>';continue;}
    var cls='para';if(/^Source:/i.test(l)||/^\(.*retrieved/i.test(l))cls+=' src';else if(/^⚡/.test(l))cls+=' crit';
    o+='<div class="'+cls+'">'+inline(l)+'</div>';
  }
  closeAll();
  document.getElementById('app').innerHTML=o;
  var m=(head[0]||'').match(/—\s*(.+)$/);var upd=m?m[1]:'';
  document.getElementById('upd').textContent=upd?'Last updated: '+upd:'';
  document.getElementById('foot').innerHTML='Finance Agent V4'+(upd?' · Last updated: '+esc(upd):'')+'<br><a href="https://rdwills02.github.io/BTC_Brief/">Dashboard</a> · <a href="https://rdwills02.github.io/BTC_Brief/glossary.html">Glossary</a> · <a href="https://rdwills02.github.io/BTC_Brief/calculator.html">Calculator</a>';
  document.title='Full Brief'+(upd?' — '+upd:'');
}
fetch('brief.md',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();}).then(render).catch(function(e){document.getElementById('app').innerHTML='<div class="err">Brief unavailable: '+esc(e.message)+'. The page structure is fixed; the morning task writes brief.md.</div>';});
</script>
</body></html>
